# On a published GitHub release, build the signed bundle and submit it to Google Play production for review.
# A newer commit replaces the release on the track, so a submission still in review is cancelled for this one.
# Secrets: KEYSTORE_PROPERTIES (the local keystore.properties file), UPLOAD_JKS (base64 of upload.jks),
# PLAY_SERVICE_ACCOUNT_JSON (key of a service account invited in Play Console with release permissions).
name: Google Play

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore upload key
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          UPLOAD_JKS: ${{ secrets.UPLOAD_JKS }}
        run: |
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          printf '%s' "$UPLOAD_JKS" | base64 -d > upload.jks
      - run: ./gradlew bundleRelease
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.borodutch.absplus
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ github.event.release.name }}
          track: production
