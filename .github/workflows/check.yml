name: Checks
# Site (docs/) and Markdown changes don't touch the apps, so they skip the build and test runs.
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: probe98-exp
            tests: >-
              -only-testing:UITests/ListExp98
          - group: probe98-swipe-padding
            tests: >-
              -only-testing:UITests/ListProbe98/testProbeEdgeSwipeMinXPadding
          - group: probe98-swipe-margins
            tests: >-
              -only-testing:UITests/ListProbe98/testProbeEdgeSwipeMinXMargins
    name: iOS (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - name: Build and exercise mapped regression suites
        run: >-
          xcodebuild -project ios/ABSPlus.xcodeproj -scheme ABSPlus
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -parallel-testing-enabled NO
          -resultBundlePath ios-tests.xcresult
          ${{ matrix.tests }} test
      - name: Preserve native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results-${{ matrix.group }}
          path: ios-tests.xcresult
