name: Checks
# Site (docs/) and Markdown changes don't touch the apps, so they skip the build and test runs.
on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: python3 -m unittest discover -s .github/scripts # the shared release scripts
  ios:
    runs-on: macos-26
    # Leaves room for ios/ci_simulator.py to download the iOS platform on a runner missing it,
    # and for xcodebuild's -destination-timeout.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: loading
            tests: >-
              -only-testing:UITests/LoadingLifecycle -only-testing:UITests/PlaybackPreparation
          - group: isolation-retained
            tests: >-
              -only-testing:UITests/RetainedDownloads -only-testing:UITests/SessionIsolation
          - group: offline-progress
            tests: >-
              -only-testing:UITests/ListLifecycle -only-testing:UITests/Accessibility
              -only-testing:UITests/OfflineHome -only-testing:UITests/OfflineLibrary
              -only-testing:UITests/OfflineSeries -only-testing:UITests/ProgressReplay
              -only-testing:UITests/DownloadRetries -only-testing:UITests/DownloadRemoval
              -only-testing:UITests/BookSkips
    name: iOS (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      # Some runners start without the preinstalled simulators or are slow to show them to xcodebuild,
      # so pick (or create) one that exists, boot it, and let xcodebuild wait for it.
      - name: Resolve iOS Simulator
        timeout-minutes: 25
        run: |
          python3 -m unittest ios/ci_simulator_test.py
          udid=$(python3 ios/ci_simulator.py)
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      # Building for a generic destination needs no device discovery, and gives the booted
      # simulator minutes to show up for xcodebuild before the tests look for it.
      - name: Build for testing
        run: >-
          xcodebuild -project ios/ABSPlus.xcodeproj -scheme ABSPlus
          -destination 'generic/platform=iOS Simulator' ARCHS=arm64
          -resultBundlePath ios-build.xcresult
          build-for-testing
      - name: Exercise mapped regression suites
        run: >-
          xcodebuild -project ios/ABSPlus.xcodeproj -scheme ABSPlus
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -destination-timeout 300
          -parallel-testing-enabled NO
          -resultBundlePath ios-tests.xcresult
          ${{ matrix.tests }} test-without-building
      - name: Preserve native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results-${{ matrix.group }}
          path: |
            ios-build.xcresult
            ios-tests.xcresult
