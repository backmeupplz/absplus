name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and exercise navigation and accessibility
        run: >-
          xcodebuild -project ios/ABSPlus.xcodeproj -scheme ABSPlus
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -only-testing:UITests/ListLifecycle -only-testing:UITests/Accessibility -only-testing:UITests/OfflineHome -only-testing:UITests/OfflineLibrary -only-testing:UITests/OfflineSeries -only-testing:UITests/DownloadRetries -only-testing:UITests/DownloadRemoval test
